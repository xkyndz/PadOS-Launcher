name: Build PadOS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Extract source
        run: |
          mkdir -p source
          unzip -o PadOS-Source.zip -d source
          find source -name settings.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle -print -quit)
          test -n "$PROJECT"
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PadOS-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
